<div class="page page-rentroll" id="page-rentroll" style="padding-top:70px">
  <div class="print-header" style="display:none">
    <div class="print-logo">🏠 NestIQ Pro</div>
    <div class="print-date" id="printDateLabel"></div>
  </div>
  <section class="section rentroll-section reveal">
    <div class="rentroll-header">
      <div>
        <div class="eyebrow" style="justify-content:flex-start">Financials</div>
        <h2 class="section-title rentroll-title reveal" style="margin-bottom:4px">Rent Roll</h2>
        <p class="rentroll-sub">Monthly snapshot of all properties and payment status</p>
        <div class="rentroll-month-controls">
          <button type="button" class="btn-outline btn-sm" id="rentrollPrev" aria-label="Previous month">←</button>
          <span class="rentroll-month-label" id="rentrollMonthLabel">—</span>
          <button type="button" class="btn-outline btn-sm" id="rentrollNext" aria-label="Next month">→</button>
          <label class="rentroll-month-input-wrap no-print">
            <span class="sr-only">Month</span>
            <input type="month" class="form-input" id="rentrollMonthInput" style="width:auto;min-width:150px;padding:8px 12px;font-size:0.85rem">
          </label>
        </div>
      </div>
      <div class="rentroll-actions no-print">
        <button type="button" class="btn-outline btn-sm" onclick="exportRentRollPDF()">Export PDF</button>
        <button type="button" class="btn-outline btn-sm" onclick="exportRentRollCSV()">Export CSV</button>
        <button type="button" class="btn-outline btn-sm no-print" onclick="window.print()" style="gap:6px">🖨️ Print</button>
      </div>
    </div>

    <div class="rentroll-stats" id="rentrollStats"></div>

    <div class="rentroll-vacant-summary no-print" id="rentrollVacantSummary" style="display:none"></div>

    <div class="rentroll-toolbar no-print">
      <span class="rentroll-toggle-label">View:</span>
      <button type="button" class="btn-outline btn-sm rentroll-toggle active" id="rentrollToggleAll" data-mode="all">All Properties</button>
      <button type="button" class="btn-outline btn-sm rentroll-toggle" id="rentrollToggleGroup" data-mode="group">Group by Status</button>
    </div>

    <div class="rentroll-table-wrap table-wrap reveal" id="rentrollTableWrap"></div>
  </section>
</div>
