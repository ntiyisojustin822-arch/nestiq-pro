      <div>
        <p class="eyebrow">Rentals</p>
        <h1 class="section-title reveal" style="margin-bottom:4px">Available listings</h1>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="nestiqListingsGuestBar">
